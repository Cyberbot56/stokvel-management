<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        /* Profile Modal Styles */
        .profile-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .profile-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .profile-modal {
            background: #242833;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }
        .profile-modal-overlay.active .profile-modal {
            background: #242833;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
        }
        .profile-band {
            height: 90px;
            background: linear-gradient(120deg, #15171f 0%, #15171f 50%, #242833 100%);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 30px;
            width: 36px;
            height: 36px;
            font-size: 20px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-weight: 700;
        }
        .modal-close:hover { background: rgba(255, 255, 255, 0.4); }
        .avatar-wrap {
            position: absolute;
            bottom: -44px;
            left: 50%;
            transform: translateX(-50%);
        }
        .profile-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: #15171f;
            border: 3px solid #22d3ee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
            color: #22d3ee;
            box-shadow: 0 4px 16px rgba(14, 148, 144, 0.25);
        }
        .profile-body {
            padding: 60px 32px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .profile-name {
            font-size: 22px;
            font-weight: 700;
            color: #cdd1dc;
            text-align: center;
            margin: 0;
        }
        .profile-email {
            font-size: 14px;
            color: #9095a6;
            text-align: center;
            margin: 4px 0 0;
        }
        .profile-since {
            font-size: 12px;
            color: #7c8195;
            margin-top: 6px;
        }
        .profile-details {
            width: 100%;
            margin-top: 24px;
            border: 1px solid rgba(34, 211, 238, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        .detail-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(34, 211, 238, 0.06);
            font-size: 13px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            color: #9095a6;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }
        .detail-value {
            color: #cdd1dc;
            font-weight: 600;
            text-align: right;
        }
        .logout-full {
            margin-top: 28px;
            width: 100%;
            padding: 13px;
            background: rgba(255, 71, 87, 0.08);
            color: #ef4444;
            border: 1.5px solid #fecaca;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .logout-full:hover {
            background: rgba(255, 71, 87, 0.15);
            transform: translateY(-1px);
        }
        .avatar[onclick], .header-avatar[onclick] {
            cursor: pointer;
            transition: box-shadow 0.2s ease, transform 0.15s ease;
        }
        .avatar[onclick]:hover, .header-avatar[onclick]:hover {
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.3);
            transform: scale(1.07);
        }
    </style>
</head>

<body>

    <header>
        <figure class="header-logo">
            <i class="logo-mark"></i>
            <h1>STOKVEL</h1>
        </figure>
        <p class="header-title">Dashboard</p>
        <nav class="header-right">
            <address class="avatar" id="avatar" onclick="showProfileModal()" style="cursor:pointer;" title="My profile"></address>
        </nav>
    </header>

    <section class="welcome-banner">
        <p class="welcome-greeting" id="welcomeGreeting">Welcome back!</p>
        <p class="welcome-sub">We're glad you're continuing your stokvel journey with us.</p>
    </section>

    <section class="actions">
        <nav class="actions-right">
            <button id="buttonCreateGroup">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Create Group
            </button>
        </nav>
    </section>

    <main>
        <p id="noGroups" hidden>You are not a member of any groups yet.</p>
        <p id="loadError" class="state-message" hidden>Error loading groups. Please try again later.</p>
        <section class="groups-grid" hidden></section>
    </main>


    <script src="../scripts/config.js"></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script src="../scripts/auth_service.js"></script>
    <script src="../scripts/allGroups.js"></script>
    <script src="../scripts/rates.js"></script>
    <script src="../scripts/profile-modal.js"></script>

</body>
</html>
