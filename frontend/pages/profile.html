<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Modal – Stokvel App</title>
  <style>
    /* Modal overlay styles */
    .profile-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .profile-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .profile-modal {
      background: white;
      border-radius: 24px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      transform: scale(0.95);
      transition: transform 0.25s ease;
      position: relative;
    }

    .profile-modal-overlay.active .profile-modal {
      transform: scale(1);
    }

    /* Modal content styling */
    .profile-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Decorative top band */
    .profile-band {
      height: 90px;
      background: linear-gradient(120deg, #a8ede8 0%, #3cc8c0 35%, #0e9490 70%, #034e52 100%);
      position: relative;
    }

    /* Close button */
    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      border: none;
      border-radius: 30px;
      width: 36px;
      height: 36px;
      font-size: 20px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
      z-index: 10;
      font-weight: 700;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Avatar sits half on band, half below */
    .avatar-wrap {
      position: absolute;
      bottom: -44px;
      left: 50%;
      transform: translateX(-50%);
    }

    .profile-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #034e52;
      border: 4px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      color: #2dd4bf;
      letter-spacing: 1px;
      box-shadow: 0 4px 16px rgba(14, 148, 144, 0.25);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    .profile-body {
      padding: 60px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 700;
      color: #034e52;
      text-align: center;
      margin: 0;
    }

    .profile-email {
      font-size: 14px;
      color: #64748b;
      text-align: center;
      margin: 4px 0 0;
    }

    .profile-since {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* Info rows */
    .profile-details {
      width: 100%;
      margin-top: 24px;
      border: 1px solid rgba(14, 148, 144, 0.12);
      border-radius: 12px;
      overflow: hidden;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(14, 148, 144, 0.08);
      font-size: 13px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #64748b;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      color: #0f172a;
      font-weight: 600;
      text-align: right;
    }

    /* Logout button inside modal */
    .logout-full {
      margin-top: 28px;
      width: 100%;
      padding: 13px;
      background: white;
      color: #ef4444;
      border: 1.5px solid #fecaca;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .logout-full:hover {
      background: #fef2f2;
      transform: translateY(-1px);
    }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, #e0f7f6 25%, #f0fafa 50%, #e0f7f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      display: inline-block;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Hide scrollbar on modal content */
    .profile-modal::-webkit-scrollbar {
      width: 6px;
    }

    .profile-modal::-webkit-scrollbar-track {
      background: #f0fafa;
      border-radius: 10px;
    }

    .profile-modal::-webkit-scrollbar-thumb {
      background: #0e9490;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- This modal will be dynamically injected and shown when needed -->
  <div id="profileModal" class="profile-modal-overlay">
    <div class="profile-modal">
      <div class="profile-card">
        <button class="modal-close" id="closeProfileModal" aria-label="Close profile">✕</button>

        <div class="profile-band">
          <div class="avatar-wrap">
            <div class="profile-avatar" id="profile-avatar">?</div>
          </div>
        </div>

        <div class="profile-body">
          <h2 class="profile-name" id="profile-name">
            <span class="skeleton" style="width:160px;height:22px;">&nbsp;</span>
          </h2>
          <p class="profile-email" id="profile-email">
            <span class="skeleton" style="width:200px;height:16px;">&nbsp;</span>
          </p>
          <p class="profile-since" id="profile-since"></p>

          <div class="profile-details">
            <div class="detail-row">
              <span class="detail-label">Full name</span>
              <span class="detail-value" id="detail-name">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Email</span>
              <span class="detail-value" id="detail-email">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Member since</span>
              <span class="detail-value" id="detail-since">—</span>
            </div>
          </div>

          <button class="logout-full" id="logoutBtn">Log out</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/config.js"></script>
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <script src="../scripts/auth_service.js"></script>
  <script>

    // ── Helpers ────────────────────────────────────────────────────────────────

    function getInitials(name) {
      if (!name) return '?';
      return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString('en-ZA', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    // ── Populate modal with user data ──────────────────────────────────────────
    // Accepts an Auth0 user object OR falls back to localStorage values set by
    // auth_service.js (userId / userName stored after /api/auth/me succeeds).

    function populateProfile(user) {
      // Build a unified data object — prefer Auth0 fields, fall back to localStorage
      const name  = (user && (user.name || user.nickname || user.email))
                    || localStorage.getItem('userName')
                    || '—';
      const email = (user && user.email) || '—';
      const since = (user && (user.created_at || user.updated_at)) || null;

      const avatarEl    = document.getElementById('profile-avatar');
      const nameEl      = document.getElementById('profile-name');
      const emailEl     = document.getElementById('profile-email');
      const sinceEl     = document.getElementById('profile-since');
      const detailName  = document.getElementById('detail-name');
      const detailEmail = document.getElementById('detail-email');
      const detailSince = document.getElementById('detail-since');

      if (avatarEl)    avatarEl.textContent    = getInitials(name);
      if (nameEl)      nameEl.textContent       = name;
      if (emailEl)     emailEl.textContent      = email;
      if (detailName)  detailName.textContent   = name;
      if (detailEmail) detailEmail.textContent  = email;

      if (sinceEl)     sinceEl.textContent      = since ? 'Member since ' + formatDate(since) : '';
      if (detailSince) detailSince.textContent  = since ? formatDate(since) : '—';
    }

    // ── Fetch from Auth0 then populate ────────────────────────────────────────
    // Called once auth0Client is ready (via onAuthReady below).

    async function loadUserAndPopulate() {
      try {
        // auth0Client is guaranteed to exist here because onAuthReady()
        // is only called after configureClient() succeeds in auth_service.js
        const user = await auth0Client.getUser();
        if (user) {
          populateProfile(user);
        } else {
          // Not authenticated — fall back to whatever localStorage has
          populateProfile(null);
        }
      } catch (err) {
        console.error('Profile: could not fetch user from Auth0:', err);
        populateProfile(null); // still render with localStorage fallback
      }
    }

    // ── onAuthReady: called by auth_service.js after auth0Client is ready ─────

    function onAuthReady() {
      loadUserAndPopulate();
    }

    // ── Show / hide modal ─────────────────────────────────────────────────────

    function closeModal() {
      const modal = document.getElementById('profileModal');
      if (modal) modal.classList.remove('active');
    }

    window.showProfileModal = function () {
      const modal = document.getElementById('profileModal');
      if (!modal) return;
      modal.classList.add('active');
      // Re-fetch so the data is always fresh when the modal opens
      if (typeof auth0Client !== 'undefined' && auth0Client) {
        loadUserAndPopulate();
      }
    };

    window.closeProfileModal = closeModal;

    // ── Close triggers ────────────────────────────────────────────────────────

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    const modalOverlay = document.getElementById('profileModal');
    if (modalOverlay) {
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });
    }

    const closeBtn = document.getElementById('closeProfileModal');
    if (closeBtn) closeBtn.addEventListener('click', closeModal);

    // ── Logout ────────────────────────────────────────────────────────────────

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        try {
          if (typeof auth0Client !== 'undefined' && auth0Client) {
            localStorage.removeItem('userId');
            localStorage.removeItem('userName');
            await auth0Client.logout({ logoutParams: { returnTo: window.location.origin + '/pages/index.html' } });
          }
        } catch (err) {
          console.error('Logout error:', err);
          window.location.href = '../index.html';
        }
      });
    }

  </script>
</body>
</html>
